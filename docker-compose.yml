services:
  app:
    build:
      context: docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: route-connex-sdk-php
    working_dir: /app
    # Feature tests call the live API at BASE_URL (.env): use the host network so
    # hosts from /etc/hosts (e.g. routeconnex.local) resolve as they do locally.
    network_mode: host
    volumes:
      - .:/app
      - composer-cache:/home/app/.composer

volumes:
  composer-cache:
